trainer:
  init:
    model:
      name: gnn
      architecture:
        type: graphsage
        n_feat: 100
        n_class: 47
        hidden_dim: 1024
        num_layers: 3
        dropout: 0.5
        aggregator: mean
      task:
        to_float16: true
        disable_log_softmax: false
        compute_eval_metrics: false
    backend:
      backend_type: CSX
      cluster_config:
        num_csx: 1
        num_workers_per_csx: 1
        job_time_sec: 14400
        job_labels:
        - run=sage-products-throughput-trial-.-w4-pf2-persist-r1
        - study=7f3d10152b
        python_paths:
        - $REPO_ROOT/src/cerebras/modelzoo/../..
        workflow_id: wflow-embuyc6xpds8vj7segqu9i
    model_dir: $REPO_ROOT/model_dirs/hpcasia_final/products_20260922T151528.153532Z/model
    optimizer:
      AdamW:
        params: []
        lr: 0.003
        betas:
        - 0.9
        - 0.999
        eps: 1.0e-06
        weight_decay: 0.0005
    precision:
      enabled: true
      fp16_type: float16
      loss_scaling_factor: dynamic
      initial_loss_scale: 32768.0
      steps_per_increase: 2000
    loop:
      num_steps: null
      max_steps: 1640
      num_epochs: null
      steps_per_epoch: null
      eval_frequency: null
      grad_accum_steps: 1
    checkpoint:
      steps: null
      autoload_last_checkpoint: false
      save_initial_checkpoint: false
    logging:
      log_steps: 10
    callbacks:
    - CheckLoss: {}
    - LogOptimizerParamGroup:
        keys: lr
    - ComputeNorm: {}
    - ModelEvalMetrics: {}
    - RateProfiler: {}
    - DurationProfiler: {}
    - FlopUtilization: {}
    - SavePerformanceData: {}
    - DumpAvailableTensorNames: {}
    - ModelZooParamsMetadata: {}
    - SamplesStreamedInfo: {}
    loggers:
    - ProgressLogger: {}
    - TensorBoardLogger: {}
    - TelemetryLogger: {}
    seed: 42
    autorestart:
      max_num_restarts: 0
  fit:
    train_dataloader:
      data_processor: GNNDataProcessor
      dataset_name: ogbn-products
      dataset: ogbn_products
      dataset_profiles:
        ogbn_products:
          dataset_name: ogbn-products
          data_dir: $MODELZOO_ROOT/models/gnn/data/datasets
          pad_node_id: 0
      data_dir: $REPO_ROOT/src/cerebras/modelzoo/models/gnn/data/datasets
      sampling_mode: neighbor
      fanouts:
      - 15
      - 10
      - 5
      cache_fraction: null
      sampler_seed: 42
      batch_size: 4096
      drop_last: false
      num_workers: 4
      shuffle: true
      prefetch_factor: 2
      persistent_workers: true
      pin_memory: true
      static_batch_cache_size: 0
      measure_batch_accounting: true
      worker_diagnostics:
        enabled: false
      split: train
      use_fake_data: false
      pad_node_id: 0
    val_dataloader: null
    ckpt_path: null
  validate: null
  validate_all: null
