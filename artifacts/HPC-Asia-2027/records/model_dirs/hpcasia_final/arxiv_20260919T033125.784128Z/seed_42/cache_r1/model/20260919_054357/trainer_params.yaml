trainer:
  init:
    model:
      name: gnn
      architecture:
        type: graphsage
        n_feat: 128
        n_class: 40
        hidden_dim: 1024
        num_layers: 3
        dropout: 0.5
        aggregator: mean
      task:
        to_float16: true
        disable_log_softmax: false
        compute_eval_metrics: false
    backend:
      backend_type: CSX
      cluster_config:
        num_csx: 1
        num_workers_per_csx: 1
        job_time_sec: 7200
        job_labels:
        - run=sage-arxiv-cache-trial-seed_42-cache_r1-w4-pf2-pe-cb113b239a
        - study=2f7cea0fab
        python_paths:
        - $REPO_ROOT/src/cerebras/modelzoo/../..
        workflow_id: wflow-2ppwfzeaizftcjgqvkca93
    model_dir: $REPO_ROOT/model_dirs/hpcasia_final/arxiv_20260919T033125.784128Z/seed_42/cache_r1/model
    optimizer:
      AdamW:
        params: []
        lr: 0.003
        betas:
        - 0.9
        - 0.999
        eps: 1.0e-06
        weight_decay: 0.0005
    precision:
      enabled: true
      fp16_type: float16
      loss_scaling_factor: dynamic
    loop:
      num_steps: null
      max_steps: 840
      num_epochs: null
      steps_per_epoch: null
      eval_frequency: null
      grad_accum_steps: 1
    checkpoint:
      steps: null
      autoload_last_checkpoint: false
      save_initial_checkpoint: false
    logging:
      log_steps: 10
    callbacks:
    - CheckLoss: {}
    - LogOptimizerParamGroup:
        keys: lr
    - ComputeNorm: {}
    - ModelEvalMetrics: {}
    - RateProfiler: {}
    - DurationProfiler: {}
    - FlopUtilization: {}
    - SavePerformanceData: {}
    - DumpAvailableTensorNames: {}
    - ModelZooParamsMetadata: {}
    - SamplesStreamedInfo: {}
    loggers:
    - ProgressLogger: {}
    - TensorBoardLogger: {}
    - TelemetryLogger: {}
    seed: 42
    autorestart:
      max_num_restarts: 0
  fit:
    train_dataloader:
      data_processor: GNNDataProcessor
      dataset_name: ogbn-arxiv
      dataset: ogbn_arxiv
      dataset_profiles:
        ogbn_arxiv:
          dataset_name: ogbn-arxiv
          data_dir: $MODELZOO_ROOT/models/gnn/data/datasets
          pad_node_id: 0
      data_dir: $REPO_ROOT/src/cerebras/modelzoo/models/gnn/data/datasets
      sampling_mode: neighbor
      fanouts:
      - 15
      - 10
      - 5
      cache_fraction: 1.0
      sampler_seed: 42
      batch_size: 4096
      drop_last: false
      num_workers: 4
      shuffle: true
      prefetch_factor: 2
      persistent_workers: true
      pin_memory: true
      static_batch_cache_size: 0
      measure_batch_accounting: true
      worker_diagnostics:
        enabled: false
      split: train
      use_fake_data: false
      pad_node_id: 0
    val_dataloader: null
    ckpt_path: null
  validate: null
  validate_all: null
