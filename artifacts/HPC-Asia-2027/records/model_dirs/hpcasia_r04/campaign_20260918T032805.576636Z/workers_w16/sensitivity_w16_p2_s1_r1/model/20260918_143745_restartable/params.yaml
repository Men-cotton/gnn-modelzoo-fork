trainer:
  init:
    seed: 42
    model:
      name: gnn
      task:
        compute_eval_metrics: false
        disable_log_softmax: false
        to_float16: true
      architecture:
        type: graphsage
        hidden_dim: 1024
        num_layers: 3
        dropout: 0.5
        aggregator: mean
        n_feat: 128
        n_class: 40
    optimizer:
      AdamW:
        params: []
        weight_decay: 0.0005
        learning_rate: 0.003
    precision:
      enabled: true
      fp16_type: float16
      loss_scaling_factor: dynamic
    model_dir: $REPO_ROOT/model_dirs/hpcasia_r04/campaign_20260918T032805.576636Z/workers_w16/sensitivity_w16_p2_s1_r1/model
    loop:
      max_steps: 440
      steps_per_epoch: null
      eval_frequency: null
      num_steps: null
      num_epochs: null
      grad_accum_steps: 1
    logging:
      log_steps: 10
    backend:
      backend_type: CSX
      cluster_config:
        num_csx: 1
        num_workers_per_csx: 1
        job_time_sec: 7200
        job_labels:
        - gnn-model=graphsage
        - gnn-dataset=ogbn-arxiv
        - gnn-cache=none
        - gnn-mode=sensitivity
        - gnn-workers=16
        - gnn-repeat=1
        - gnn-trial=sensitivity_w16_p2_s1_r1
        - gnn-study=workers_w16-57b66db72b
        python_paths:
        - $REPO_ROOT/src/cerebras/modelzoo/../..
        workflow_id: wflow-ny3x9qmvcmhadru9r9g97e
    checkpoint:
      steps: null
      autoload_last_checkpoint: false
      save_initial_checkpoint: false
    autorestart:
      max_num_restarts: 0
    callbacks: []
    loggers: []
  fit:
    train_dataloader:
      data_processor: GNNDataProcessor
      sampling_mode: neighbor
      fanouts:
      - 15
      - 10
      - 5
      batch_size: 4096
      drop_last_batch: false
      num_workers: 16
      prefetch_factor: 2
      persistent_workers: true
      pin_memory: true
      sampler_seed: 42
      shuffle: true
      cache_fraction: null
      split: train
      dataset_profiles:
        ogbn_arxiv:
          dataset_name: ogbn-arxiv
          data_dir: $MODELZOO_ROOT/models/gnn/data/datasets
          pad_node_id: 0
      dataset: ogbn_arxiv
      static_batch_cache_size: 0
      use_fake_data: false
      measure_batch_accounting: true
    val_dataloader: null
    ckpt_path: null
  validate: null
  validate_all: null
